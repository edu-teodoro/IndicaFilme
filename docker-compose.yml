version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: indica-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indica-filmes-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: "8080"
      MONGODB_URI: "mongodb://mongodb:27017/indica-filmes"
      LOCAL_FALLBACK_ENABLED: "false"
      SWAGGER_ENABLED: "false"
      LOG_LEVEL: "INFO"
      ADMIN_API_KEY: "${ADMIN_API_KEY:}"
      TMDB_API_KEY: ""

volumes:
  mongodb_data: